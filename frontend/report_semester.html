<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Отчёт по семестру</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body {
      margin: 0;
      padding: 2rem;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(to right, #eef2f7, #dbe9ff);
      color: #222;
      position: relative;
      overflow: hidden;
    }

    h2 {
      margin-bottom: 1.5rem;
      font-weight: 600;
      font-size: 1.6rem;
      z-index: 1;
      position: relative;
    }

    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 2rem;
      z-index: 1;
      position: relative;
    }

    select, button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      background-color: #fff;
      transition: 0.2s ease;
    }

    button:hover {
      background-color: #0078d4;
      color: white;
      border-color: #0078d4;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      box-shadow: 0 0 12px rgba(0,0,0,0.05);
      border-radius: 8px;
      overflow: hidden;
      z-index: 1;
      position: relative;
    }

    th, td {
      padding: 0.8rem;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      background-color: #f0f4f8;
      font-weight: 600;
    }

    td {
      font-size: 0.95rem;
    }

    .empty-row td {
      text-align: center;
      color: #777;
      font-style: italic;
    }

    .back-btn {
      margin-top: 2rem;
      display: inline-block;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      background-color: #fff;
      transition: 0.2s ease;
      text-decoration: none;
      color: #333;
      z-index: 1;
      position: relative;
    }

    .back-btn:hover {
      background-color: #0078d4;
      color: white;
      border-color: #0078d4;
    }

    /* Плавающие кружки */
    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(0, 120, 212, 0.08);
      animation: float 24s infinite linear;
      z-index: 0;
    }

    .circle:nth-child(1) {
      width: 120px;
      height: 120px;
      top: 12%;
      left: 6%;
      animation-delay: 0s;
    }

    .circle:nth-child(2) {
      width: 180px;
      height: 180px;
      top: 55%;
      left: 78%;
      animation-delay: 5s;
    }

    .circle:nth-child(3) {
      width: 90px;
      height: 90px;
      top: 82%;
      left: 28%;
      animation-delay: 10s;
    }

    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-25px) rotate(180deg); }
      100% { transform: translateY(0) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="circle"></div>
  <div class="circle"></div>
  <div class="circle"></div>

  <h2>📘 Отчёт по учебной нагрузке</h2>

  <div class="controls">
    <label for="semesterSelect">Семестр:</label>
    <select id="semesterSelect">
      <option value="1">1 семестр</option>
      <option value="2">2 семестр</option>
    </select>
    <button id="loadReportBtn">Загрузить отчёт</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>👨‍🏫 Преподаватель</th>
        <th>🎓 Группа</th>
        <th>📚 Предмет</th>
        <th>🕒 Назначено</th>
        <th>✅ Выполнено</th>
      </tr>
    </thead>
    <tbody id="reportTableBody">
      <tr class="empty-row">
        <td colspan="5">Выберите семестр и нажмите «Загрузить отчёт»</td>
      </tr>
    </tbody>
  </table>

  <a href="/" class="back-btn">← Назад</a>

  <script src="/static/script.js"></script>
</body>
</html>
