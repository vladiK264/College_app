<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Добавить группу</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(to right, #f0f4f8, #e0eafc);
      margin: 0;
      padding: 2rem;
      color: #333;
      position: relative;
      overflow: hidden;
    }

    h2 {
      margin-bottom: 1.5rem;
      font-weight: 600;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 400px;
      background: white;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      z-index: 1;
      position: relative;
    }

    input {
      padding: 0.6rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      background-color: #fff;
      transition: 0.2s ease;
    }

    button:hover {
      background-color: #0078d4;
      color: white;
      border-color: #0078d4;
      cursor: pointer;
    }

    .back-btn {
      margin-top: 2rem;
      display: inline-block;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      background-color: #fff;
      transition: 0.2s ease;
      text-decoration: none;
      color: #333;
    }

    .back-btn:hover {
      background-color: #0078d4;
      color: white;
      border-color: #0078d4;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(0, 120, 212, 0.08);
      animation: float 24s infinite linear;
      z-index: 0;
    }

    .circle:nth-child(1) {
      width: 100px;
      height: 100px;
      top: 10%;
      left: 5%;
    }

    .circle:nth-child(2) {
      width: 150px;
      height: 150px;
      top: 60%;
      left: 80%;
      animation-delay: 5s;
    }

    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(180deg); }
      100% { transform: translateY(0) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="circle"></div>
  <div class="circle"></div>

  <h2>➕ Добавить новую группу</h2>

  <form id="groupForm">
    <input type="text" name="name" placeholder="Название группы (например, БП-21)" required />
    <input type="number" name="year" placeholder="Год обучения (например, 2025)" min="2000" max="2100" required />
    <button type="submit">Добавить</button>
  </form>

  <a href="/" class="back-btn">← Назад</a>

  <script>
    document.getElementById("groupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const group = Object.fromEntries(formData.entries());

      // Преобразуем year в число
      group.year = parseInt(group.year);

      try {
        const response = await fetch("/groups", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(group),
        });

        if (response.ok) {
          alert("Группа успешно добавлена!");
          e.target.reset();
        } else {
          const error = await response.json();
          alert("Ошибка: " + (error.detail || "Не удалось добавить группу."));
        }
      } catch (err) {
        alert("Ошибка соединения с сервером.");
        console.error(err);
      }
    });
  </script>
</body>
</html>
